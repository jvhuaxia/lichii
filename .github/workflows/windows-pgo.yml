name: Windows PGO

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        type: string
        default: nx2

permissions:
  contents: read

concurrency:
  group: windows-pgo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 PGO
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    strategy:
      matrix:
        include:
          - platform: windows-x86_64-pgo
            pgo: true
            mingw: true
    steps:
      - name: Check out source
        id: source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s eglantine.profdata

      - name: Set up MSYS2
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
          key: objects-${{ matrix.platform }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}-v2-

      - name: Configure MinGW PGO
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build MinGW PGO
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd tests --parallel
          ccache --show-stats

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package MinGW binary
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              # The system DLLs ship with Windows, so they never need bundling.
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in lichii.exe eden-cli.exe; do
            deps "$exe"
          done
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      - name: Run OoT regression tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./build/release/bin/tests.exe).Path
          $filter = '[ampere],[shader],[oot_network],[ocarina_upscale],[fe_upscale],[dlss_contract],[starfox_upscale],[core_pinning],[storage_extent],[texture_handles],[cpu_readback],[read_traps],[buffer_ports],[pipeline_cache],[page_filter],[coherence],[nx2_present_pacer],Uniform stream reuse preserves data through mutation and session resets'
          $process = Start-Process -FilePath $exe -ArgumentList ('"' + $filter + '"') -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput build/oot-tests-stdout.txt -RedirectStandardError build/oot-tests-stderr.txt
          Get-Content build/oot-tests-stdout.txt
          Get-Content build/oot-tests-stderr.txt
          if ($process.ExitCode -ne 0) { throw "OoT regression tests failed: $($process.ExitCode)" }

      - name: Smoke test packaged CLI
        shell: pwsh
        run: |
          $cli = (Resolve-Path ./build/release/bin/eden-cli.exe).Path
          $process = Start-Process -FilePath $cli -ArgumentList '--version' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged CLI failed: $($process.ExitCode)" }
          Write-Host "Packaged CLI --version passed with exit code $($process.ExitCode)"

      - name: Upload MinGW binary
        if: matrix.mingw
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ matrix.platform }}-${{ steps.source.outputs.commit }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30

      - name: Upload regression test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oot-regression-logs-${{ github.run_id }}
          path: build/oot-tests-*.txt
          if-no-files-found: ignore
          retention-days: 30
